<!DOCTYPE html><html><head><base target="_top"><style>
body{font:12px/1.5 Arial,sans-serif;margin:10px;color:#202124}
.n{font-size:20px} .m{color:#5f6368}
h4{font-size:11px;font-weight:600;color:#5f6368;margin:14px 0 4px;text-transform:none}
.bar{height:4px;background:#e8eaed;margin:3px 0 8px}.bar div{height:4px;background:#5f6368}.bar div.over{background:#d93025}
table{width:100%;border-collapse:collapse} td{padding:1px 0} td:last-child{text-align:right;color:#5f6368}
ul{margin:0;padding-left:14px} li{margin:2px 0} li.err{color:#d93025}
button{margin-top:12px;font-size:12px}
</style></head><body>
<div><span class="n" id="chars">-</span> <span class="m" id="range"></span></div>
<div class="bar"><div id="tot"></div></div>
<h4>단별 줄 (읽는 순서)</h4><table id="cols"></table><div class="m" id="ovf"></div>
<h4>점검</h4><ul id="lint"></ul>
<h4>확인할 것</h4><ul id="facts"></ul>
<button onclick="build()">제출 빌드</button> <span class="m" id="msg"></span>
<p class="m" id="upd"></p>
<script>
function render(s){
 chars.textContent=s.chars+'자'; range.textContent='/ '+s.min+'–'+s.max+' (공백 제외 '+s.noSpace+')';
 tot.style.width=Math.min(100,s.chars/s.max*100)+'%'; tot.className=s.chars>s.max?'over':'';
 cols.innerHTML=s.cols.map(function(c){return '<tr><td>'+c.name+'</td><td>'+Math.round(c.used)+' / '+c.cap+'</td></tr>'}).join('');
 ovf.textContent=s.overflowLines?('약 '+Math.ceil(s.overflowLines)+'줄 넘침'):'';
 lint.innerHTML=s.lint.length?s.lint.map(function(l){return '<li class="'+(l.lv=='err'?'err':'')+'">'+l.msg+'</li>'}).join(''):'<li class="m">없음</li>';
 facts.innerHTML=s.factOpen.length?s.factOpen.map(function(f){return '<li>'+f+'</li>'}).join(''):'<li class="m">없음</li>';
 upd.textContent=s.updated+' 갱신';
}
function refresh(){google.script.run.withSuccessHandler(render).getStatus()}
function build(){msg.textContent='빌드 중';google.script.run.withSuccessHandler(function(r){msg.innerHTML=r.ok?'<a target="_blank" href="'+r.url+'">완료</a> '+r.notes.join(', '):r.error}).buildSubmission()}
refresh();setInterval(refresh,5000);
</script></body></html>
